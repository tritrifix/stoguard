services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      # Détermine le "aujourd'hui" utilisé pour calculer les jours restants.
      # Sans ça le conteneur est en UTC et bascule de jour à 2 h du matin.
      TZ: ${TZ:-Europe/Paris}
      # L'app est derrière Caddy : sans ces deux en-têtes, adapter-node ne
      # connaît pas son origine publique et rejette tous les POST de
      # formulaire en 403 (protection CSRF). Caddy les envoie par défaut.
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Loopback uniquement : permet de lancer des commandes Prisma (migrate,
      # studio...) depuis l'hôte sans exposer Postgres au reste du réseau.
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  caddy_data:
  caddy_config:
