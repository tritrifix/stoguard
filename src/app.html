<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Avant tout rendu : sans ça, un chargement en thème sombre flashe
			// d'abord en clair. Doit rester synchrone et inline.
			// Le clair est le défaut : la préférence système n'est pas suivie,
			// seul un choix explicite déjà fait dans l'app bascule en sombre.
			try {
				if (localStorage.getItem('stoguard:theme') === 'dark') {
					document.documentElement.dataset.theme = 'dark';
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
